# Wdrożenie strony Kapitałowni na hosting home.pl przez FTPS.
# Uruchamia się samo po zmianie strony na gałęzi main albo ręcznie (Actions > Wdrożenie > Run workflow).
# Hasło FTP jest wyłącznie w GitHub Secrets (Settings > Secrets and variables > Actions) jako FTP_PASSWORD.
# Adres serwera, login i katalog są poniżej w env. Można je nadpisać sekretami FTP_HOST, FTP_USER, FTP_DIR.
# Bez hasła workflow tylko testuje i buduje stronę.
name: Wdrożenie

on:
  push:
    branches: [main]
    paths: ['site/**', 'package.json', 'package-lock.json', '.github/workflows/wdrozenie.yml']
  workflow_dispatch:
    inputs:
      tylko_sprawdz:
        description: 'Tylko sprawdź połączenie i zrób kopię plików z serwera, bez wgrywania'
        type: boolean
        default: true

concurrency: wdrozenie

env:
  FTP_HOST: ${{ secrets.FTP_HOST || 'serwer2612522.hosting-home.pl' }}
  FTP_USER: ${{ secrets.FTP_USER || 'wdrozenie@kapitalownia.pl' }}
  FTP_DIR: ${{ secrets.FTP_DIR || '/' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # pełna historia, z niej liczone są daty lastmod w sitemap.xml
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp php-cli > /dev/null

      - name: Przeglądarka do testów
        run: npx playwright-core install --with-deps chromium

      - name: Testy
        run: npm test

      - name: Budowa
        run: node site/build.mjs --mode=production --out=out

      - name: Sprawdzenie sekretów FTP
        id: sekrety
        env:
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          if [ -n "$FTP_HOST" ] && [ -n "$FTP_USER" ] && [ -n "$FTP_PASSWORD" ] && [ -n "$FTP_DIR" ]; then
            echo "gotowe=tak" >> "$GITHUB_OUTPUT"
          else
            echo "gotowe=nie" >> "$GITHUB_OUTPUT"
            echo "::notice::Brak sekretu FTP_PASSWORD. Strona przeszła testy i budowę, ale nie została wgrana."
          fi

      - name: Kopia zapasowa plików z serwera
        if: steps.sekrety.outputs.gotowe == 'tak'
        env:
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          mkdir -p kopia
          lftp -u "$FTP_USER","$FTP_PASSWORD" "$FTP_HOST" -e "set ftp:ssl-force true; set ssl:verify-certificate yes; set net:max-retries 2; ls -la $FTP_DIR; mirror --verbose $FTP_DIR kopia; bye"
          echo "Plików w kopii: $(find kopia -type f | wc -l)"

      - uses: actions/upload-artifact@v4
        if: steps.sekrety.outputs.gotowe == 'tak'
        with:
          name: kopia-serwera-${{ github.run_number }}
          path: kopia
          retention-days: 90
          include-hidden-files: true
          if-no-files-found: warn

      - name: Wgrywanie
        if: steps.sekrety.outputs.gotowe == 'tak' && (github.event_name == 'push' || !inputs.tylko_sprawdz)
        env:
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          # Bez --delete: pliki spoza strony na serwerze pozostają nietknięte
          lftp -u "$FTP_USER","$FTP_PASSWORD" "$FTP_HOST" -e "set ftp:ssl-force true; set ssl:verify-certificate yes; mirror --reverse --verbose --only-newer out $FTP_DIR; bye"

      - name: Sprawdzenie po wdrożeniu
        if: steps.sekrety.outputs.gotowe == 'tak' && (github.event_name == 'push' || !inputs.tylko_sprawdz)
        run: |
          sleep 5
          for p in / /oferta/ /kontakt/ /zamow/ /dotacja-z-urzedu-pracy/ /wsparcie-w-starcie/ /dotacje-dla-osp/ /kalkulator-dotacji/ /ocena-szans/ /polityka-prywatnosci/ /regulamin/ /sitemap.xml /robots.txt; do
            printf '%s ' "$p"; curl -s -o /dev/null -w '%{http_code}\n' "https://kapitalownia.pl$p"
          done
          printf 'brak strony (oczekiwane 404): '; curl -s -o /dev/null -w '%{http_code}\n' https://kapitalownia.pl/nie-ma-takiej-strony
          printf 'http -> https (oczekiwane 301): '; curl -s -o /dev/null -w '%{http_code}\n' http://kapitalownia.pl/
          printf 'GET formularza (oczekiwane 405): '; curl -s -o /dev/null -w '%{http_code}\n' https://kapitalownia.pl/api/formularz.php
          css=$(basename out/assets/style.*.css)
          curl -s https://kapitalownia.pl/ | grep -q "$css" && echo "Na serwerze jest nowa wersja ($css)" || { echo "Na serwerze nie ma nowej wersji ($css)"; exit 1; }

      - name: Zgłoszenie zmienionych stron do IndexNow
        if: steps.sekrety.outputs.gotowe == 'tak' && (github.event_name == 'push' || !inputs.tylko_sprawdz)
        continue-on-error: true
        run: node scripts/indexnow.cjs out/sitemap.xml kopia/sitemap.xml
